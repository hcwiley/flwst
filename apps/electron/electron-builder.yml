appId: com.crescrentwrenchstudio.flwst
productName: flwst
directories:
  buildResources: build
  output: release
files:
  # only ship what the app actually runs from
  - out/**
  - package.json

  # never ship build artifacts / repo junk or node_modules (reduces collector work)
  - '!release/**'
  - '!dist/**'
  - '!**/node_modules/**'
  - '!**/.git/**'
  - '!**/.vscode/**'
  - '!src/**'
  - '!**/*.{map,ts,tsx,md}'
  - '!**/{test,tests,__tests__,docs,doc,example,examples,coverage,tmp,cache,.turbo,.next}/**'
  - '!**/node_modules/.cache/**'
# Native addons must be unpacked so require() can load them at runtime
asarUnpack:
  - resources/**
  - '**/node_modules/keytar/**'
win:
  executableName: flwst
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
  format: ULFO
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
